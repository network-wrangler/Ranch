[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ranch-network-wrangler"
version = "0.0.1"
description = "A Python package for making travel model networks"
readme = "README.md"
requires-python = ">=3.7"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
]
dependencies = [
    "docker",
    "numpy",
    "pandas>1.0",
    "geopandas>=0.8.0",
    "networkx",
    "osmnx",
    "partridge>=1.1",
    "peartree",
    "pyproj",
    "scipy",
    "shapely",
]

[dependency-groups]
dev = [
    "geojson",
    "jsonschema",
    "folium",
    "black",
    "isort",
    "pytest",
    "jupyter",
    "notebook",
    "pytest-notebook",
]
doc = [
    "recommonmark",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]

[project.urls]
Homepage = "https://github.com/network-wrangler/Ranch"
Repository = "https://github.com/network-wrangler/Ranch"
Documentation = "https://wsp-sag.github.io/Ranch/"

[tool.setuptools]
packages = ["ranch"]
include-package-data = true

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
